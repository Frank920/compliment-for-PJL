<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>想对你说的话</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-family: "Ma Shan Zheng", "ZCOOL KuaiLe", "KaiTi", "STKaiti", cursive;
  color: #ffffff;
  background:
    linear-gradient(180deg,
      rgba(135, 206, 250, 0.55) 0%,
      rgba(70, 130, 180, 0.45) 35%,
      rgba(30, 90, 150, 0.55) 70%,
      rgba(10, 50, 110, 0.7) 100%),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  padding: 40px 24px;
  overflow: hidden;
  position: relative;
}

/* 半透明蓝色遮罩，让文字更清楚 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), transparent 30%),
    radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.12), transparent 28%),
    linear-gradient(180deg, rgba(10, 40, 90, 0.35), rgba(10, 40, 90, 0.55));
  pointer-events: none;
}

/* 轻微纸纹 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.4;
  pointer-events: none;
}

.page-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 820px;
  text-align: center;
}

.letter-title {
  font-size: 28px;
  letter-spacing: 8px;
  color: #eaf6ff;
  margin-bottom: 20px;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

.letter-content {
  font-size: 34px;
  line-height: 2;
  color: #ffffff;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 24px;
  text-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
  transition: opacity 0.45s ease;
}

.page-info {
  margin-top: 30px;
  font-size: 18px;
  color: #d6f0ff;
  letter-spacing: 4px;
}

.btns {
  position: fixed;
  bottom: 48px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 22px;
  z-index: 3;
}

button {
  font-family: inherit;
  font-size: 20px;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.5);
  padding: 12px 28px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: 4px;
  transition: all 0.25s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

/* 小屏适配 */
@media (max-width: 768px) {
  .letter-title {
    font-size: 24px;
  }

  .letter-content {
    font-size: 26px;
    line-height: 1.9;
    min-height: 220px;
  }

  button {
    font-size: 18px;
    padding: 10px 22px;
  }
}
</style>
</head>

<body>
<div class="page-wrap">
  <div class="letter-title">想对你说的话</div>
  <div class="letter-content" id="content">加载中...</div>
  <div class="page-info" id="pageInfo"></div>
</div>

<div class="btns">
  <button id="prev">上一页</button>
  <button id="next">下一页</button>
</div>

<script>
const SUPABASE_URL = "在这里粘贴你的Project URL";
const SUPABASE_ANON_KEY = "在这里粘贴anon public key";

const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let msgList = [];
let current = 0;

const contentDom = document.getElementById("content");
const pageDom = document.getElementById("pageInfo");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

async function loadData() {
  const { data } = await supabase
    .from("messages")
    .select("content")
    .order("created_at", { ascending: true });

  msgList = data ? data.map(item => item.content) : [];
  current = 0;
  render();
}

function render() {
  if (msgList.length === 0) {
    contentDom.textContent = "还没有文字，等海浪把信带来。";
    pageDom.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === msgList.length - 1;

  contentDom.style.opacity = 0;
  setTimeout(() => {
    contentDom.textContent = msgList[current];
    contentDom.style.opacity = 1;
    pageDom.textContent = `${current + 1} / ${msgList.length}`;
  }, 220);
}

prevBtn.addEventListener("click", () => {
  if (current > 0) {
    current--;
    render();
  }
});

nextBtn.addEventListener("click", () => {
  if (current < msgList.length - 1) {
    current++;
    render();
  }
});

// 键盘左右翻页
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") {
    prevBtn.click();
  } else if (e.key === "ArrowRight") {
    nextBtn.click();
  }
});

loadData();
</script>
</body>
</html>
