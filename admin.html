<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>添加新话语</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #ffffff;
  background:
    linear-gradient(180deg,
      rgba(135, 206, 250, 0.55) 0%,
      rgba(70, 130, 180, 0.45) 35%,
      rgba(30, 90, 150, 0.55) 70%,
      rgba(10, 50, 110, 0.7) 100%),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-position: center;
  padding: 40px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.admin-card {
  width: 100%;
  max-width: 640px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 24px;
  padding: 36px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

h2 {
  font-size: 26px;
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.tip-top {
  font-size: 14px;
  color: #d6f0ff;
  margin-bottom: 24px;
}

textarea {
  width: 100%;
  height: 200px;
  padding: 18px;
  font-size: 18px;
  line-height: 1.7;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  resize: vertical;
  outline: none;
  font-family: inherit;
}

textarea::placeholder {
  color: #bae6fd;
}

button {
  margin-top: 18px;
  font-size: 18px;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.5);
  padding: 12px 28px;
  border-radius: 999px;
  cursor: pointer;
  letter-spacing: 3px;
  transition: all 0.25s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.35);
}

#status {
  margin-top: 24px;
  font-size: 16px;
  min-height: 24px;
  color: #d6f0ff;
}
</style>
</head>

<body>
<div class="admin-card">
  <h2>新增一页想说的话</h2>
  <div class="tip-top">提交后，浏览页刷新即可看到新一页。</div>

  <textarea id="inputText" placeholder="在这里输入新一段话..."></textarea>
  <button id="saveBtn">保存新增</button>

  <div id="status"></div>
</div>

<script>
const SUPABASE_URL = "在这里粘贴你的Project URL";
const SUPABASE_ANON_KEY = "在这里粘贴anon public key";

const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const inputText = document.getElementById("inputText");
const saveBtn = document.getElementById("saveBtn");
const status = document.getElementById("status");

saveBtn.addEventListener("click", async () => {
  const content = inputText.value.trim();

  if (!content) {
    status.textContent = "请输入内容后再保存。";
    return;
  }

  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    status.textContent = "检测到未登录，正在跳转登录...";
    await supabase.auth.signInWithOAuth({
      provider: "github"
    });
    return;
  }

  const { error } = await supabase
    .from("messages")
    .insert([{ content }]);

  if (error) {
    status.textContent = "保存失败：" + error.message;
  } else {
    status.textContent = "已新增成功，浏览页刷新后可查看。";
    inputText.value = "";
  }
});
</script>
</body>
</html>
